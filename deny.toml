# cargo-deny 配置：licenses / advisories / bans / sources。
# 文档：https://embarkstudios.github.io/cargo-deny/
#
# 在 CI 中由 .github/workflows/ci.yml 的 `deny` job 调用。
# 本地复现：`cargo install cargo-deny && cargo deny check`。

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "NCSA",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "BSL-1.0",
    "WTFPL",
]

# `ring` 使用包含 OpenSSL / ISC / MIT 等的混合表达式，cargo-deny 默认无法识别为单一 SPDX。
# 这里通过 clarify 单独声明其 license 表达式。
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
