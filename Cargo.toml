[package]
name = "tgui"
version = "0.2.0"
authors = ["a2542209451@gmail.com"]
edition = "2021"
rust-version = "1.85"
description = "A modern, GPU-accelerated Rust GUI framework with MVVM, Taffy layout, and wgpu rendering."
license = "MIT OR Apache-2.0"
repository = "https://github.com/nandebishitaoyuan/tgui.git"
readme = "README.md"
keywords = ["gui", "graphics", "wgpu", "ui"]
categories = ["gui", "rendering"]

exclude = [
    "target/*",
    "*.png",
    ".github/*",
    "examples/*",
    # docs/ 是独立的 vitepress 站点（含 node_modules / package.json / pnpm-lock /
    # .vitepress 构建配置），属于面向网站的文档工程，不应进入 crate。
    "docs/*",
    "AGENTS.md",
    "CLAUDE.md",
    "PRODUCTION_READINESS.md",
    "FINE_GRAINED_ROADMAP.md",
    "Video.md",
    "publish.bat",
    "skills/*"
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
audio = ["dep:ffmpeg-next", "dep:cpal"]
video = ["audio"]
video-static = ["video", "ffmpeg-next/static"]
bench-support = []
# 可选：用 mimalloc 替换全局分配器。场景收集是分配密集型热路径
# （per-frame SmallVec 溢出、文本整形、HashMap），mimalloc 在 macOS/Windows 上
# 通常带来 10-25% 的分配吞吐改善。作为库默认不开启——是否替换全局分配器应由
# 下游二进制 crate 决定，避免与其分配器选择冲突。
mimalloc = ["dep:mimalloc"]
# 逐帧场景重收集的相位计时探针(collect_profile)。与 bench-support 解耦:criterion
# 基准只开 bench-support,probe 编译成 inline 空操作,热路径零成本、不污染基准数字。
# 需要相位画像时单独开启 collect-profile(它自动带上 bench-support)。
collect-profile = ["bench-support"]
# 属性级依赖归因。开启后,场景阶段解析每个视觉属性
# （background / border color/width/radius / opacity / offset / scale / text color …）时
# 会把当前正在解析的属性种类（PropertySlot）压入依赖作用域,使 Signal 读取被归因到
# 「哪个 widget 的哪个属性」,而不仅是「哪个 widget 的 Scene 阶段」。这为 Phase 4 的
# transform-only / 单属性直写快路径提供归因信息。关闭时 DependencyOwner.property 恒为
# None,行为与现状逐字节一致。失效消费侧（scene_patch_invalidation）当前只读 widget_id
# + phase,任何未被属性作用域包裹或未识别的读取都安全退化为整 widget 的 Scene 失效——
# 这是「绝不漏更新」的兜底红线。默认不开启,作为可选归因增强。
property-deps = []
# 滚动/动画 transform-only 快路径的「纯滚动帧」分类与 CPU 平移
# 基础设施。开启后,运行时会识别「本帧只有 scroll_epoch 变化、其余一切不变」的纯滚动帧,
# 并在滚动子树未发生 overflow 裁剪剔除（内容全量收集、无 should_skip_fully_clipped_child
# 命中）时,用「对缓存子树图元施加滚动增量平移 + splice 原地覆盖」绕开整树重收集;
# 任一前置不满足（发生裁剪剔除 / 嵌套滚动 / 含 overlay / 偏移越界）即干净回退到现有整帧
# 重收集,绝不产生错位。默认不开启:高价值的「每-draw 平移 uniform + 收集不剔除 + draw 阶段
# 视口裁剪」变体属 GPU 可见改动,需在真实硬件上验证后再推进,本特性先落地可证安全的 CPU 部分。
transform-only-scroll = []
# 滚动 transform-only 的「GPU 平移 uniform」变体。这是 transform-only-scroll
# 的进阶形态——不再每个滚动帧重收集滚动子树,而是让 collect 在「未滚动」坐标系一次性收集滚动容器
# 的**全部**内容（含离屏,不再 should_skip_fully_clipped_child 剔除）,之后每个纯滚动帧仅通过 wgpu
# immediate data（push-constant style）在 draw 阶段给该子树施加一个平移量,离屏内容由 GPU scissor
# 丢弃,完全绕开 collect。圆角 clip 的局部坐标随内容一起平移以避免 mask 脱钩。前置不满足（含
# virtual / 嵌套 scroll / overlay 或 portal / scrollbar 或 IME / unsupported clip 或 composite /
# 运行时 adapter 不支持 IMMEDIATES）即干净回退到 transform-only-scroll 的子树重收集或整帧重收集。
# 需启用 wgpu IMMEDIATES 原生特性（桌面 Metal / DX12 / Vulkan 支持,WebGL 不支持）,故默认不开启,
# 且在 adapter 不支持时运行时安全降级。
transform-only-scroll-gpu = ["transform-only-scroll"]

[dependencies]
accesskit = "0.24"
bytemuck = { version = "1.24", features = ["derive"] }
cosmic-text = "0.19"
crossbeam-channel = "0.5"
dpi = "0.1.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = true, features = ["jpeg", "png", "gif", "webp", "bmp"] }
geo = "0.33"
lyon = "1.0"
mimalloc = { version = "0.1", optional = true }
parking_lot = "0.12"
pollster = "0.4"
pulldown-cmark = "0.13.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
resvg = "0.47"
ropey = "1.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
smallvec = "1.15"
taffy = "0.10"
unicode-segmentation = "1.12"
usvg-remote-resolvers = { version = "0.2", features = ["reqwest_blocking"] }
svgtypes = "0.16.1"
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
winit-core = "0.31.0-beta.2"
wgpu = { version = "29", features = ["wgsl"] }
ffmpeg-next = { version = "8.0.0", optional = true, default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = "0.33"
arboard = "3.6"
cpal = { version = "0.17.3", optional = true }
log = "0.4.30"
raw-window-handle = "0.6"
rfd = "0.17"
stacker = "0.1.24"
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }
winit-win32 = "0.31.0-beta.2"

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = "0.26.1"
arboard = "3.6"
block2 = "0.6.2"
cpal = { version = "0.17.3", optional = true }
log = "0.4.30"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3.2"
raw-window-handle = "0.6"
rfd = "0.17"
stacker = "0.1.24"
winit-appkit = "0.31.0-beta.2"

[target.'cfg(target_os = "linux")'.dependencies]
accesskit_unix = "0.21.1"
arboard = "3.6"
cpal = { version = "0.17.3", optional = true }
log = "0.4.30"
notify-rust = "4"
raw-window-handle = "0.6"
rfd = "0.17"
stacker = "0.1.24"
winit-wayland = "0.31.0-beta.2"
winit-x11 = "0.31.0-beta.2"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "animation"
harness = false

[[bench]]
name = "audio_output"
harness = false

[[bench]]
name = "canvas_scene"
harness = false

[[bench]]
name = "event_handling"
harness = false

[[bench]]
name = "media_source"
harness = false

[[bench]]
name = "real_widget_pipeline"
harness = false

[[bench]]
name = "scene_rendering"
harness = false

[[bench]]
name = "single_property_patch"
harness = false

[[bench]]
name = "state_signal"
harness = false

[[bench]]
name = "text_processing"
harness = false

[[bench]]
name = "video_buffering"
harness = false

[[bench]]
name = "widget_core_layout"
harness = false

# Dev 模式性能。仅在以 tgui 为根构建时生效(cargo test / cargo run / cargo bench 的
# 调试构建),作为依赖被引用时会被下游 workspace 的 profile 覆盖,因此对发布无影响。
# 本地 crate 保持 opt-level=1(编译快、热点代码仍有基本优化),
# 把全部依赖(cosmic-text 文本整形 / lyon 镶嵌 / resvg / taffy / image 解码等
# per-frame 热点)编到 opt-level=3。依赖只编一次,后续增量构建不受影响。
[profile.dev]
opt-level = 1
lto = "off"

[profile.dev.package."*"]
opt-level = 3
