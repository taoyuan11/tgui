[package]
name = "tgui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A data-oriented, transactional GUI architecture experiment"
license = "MIT OR Apache-2.0"

[features]
# The default set describes the intended desktop developer experience. The
# adapters themselves are introduced in later phases; P0 keeps their feature
# boundaries buildable without pulling backend dependencies into the core.
default = ["desktop", "text", "image"]
desktop = ["window", "render"]
window = ["dep:winit"]
render = ["dep:wgpu", "dep:bytemuck"]
text = ["dep:cosmic-text", "dep:fontdb"]
image = ["dep:image"]
svg = ["image", "dep:resvg"]
accessibility = [
    "dep:accesskit",
    "dep:accesskit_windows",
    "dep:accesskit_macos",
    "dep:accesskit_unix",
]
webview = ["desktop"]

[dependencies]
taffy = { version = "0.13.0", default-features = false, features = [
    "std",
    "taffy_tree",
    "flexbox",
    "grid",
    "block_layout",
    "content_size",
] }
wgpu = { version = "26.0.1", default-features = false, features = [
    "std",
    "wgsl",
    "dx12",
    "metal",
    "vulkan",
    "gles",
], optional = true }
bytemuck = { version = "1.25.2", features = ["derive"], optional = true }
cosmic-text = { version = "0.17.0", default-features = false, features = [
    "std",
    "shape-run-cache",
    "swash",
], optional = true }
fontdb = { version = "0.23.0", default-features = false, features = ["std"], optional = true }
image = { version = "0.25.6", default-features = false, features = [
    "gif",
    "jpeg",
    "png",
    "webp",
], optional = true }
resvg = { version = "0.45.1", default-features = false, optional = true }
lyon_path = "1.0.19"
lyon_tessellation = "1.0.20"
accesskit = { version = "0.24.1", optional = true }
winit = { version = "0.30.12", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = { version = "0.34.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = { version = "0.26.3", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
accesskit_unix = { version = "0.22.1", optional = true }

[dev-dependencies]
pollster = "0.4.0"

[[bench]]
name = "p0_arena"
harness = false

[[bench]]
name = "p1_widget"
harness = false

[[bench]]
name = "p2_layout"
harness = false

[[bench]]
name = "p5_animation"
harness = false

[[bench]]
name = "p5_virtual_list"
harness = false

[[bench]]
name = "p7_matrix"
harness = false

[[bench]]
name = "p7_stress"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
