[package]
name = "tgui"
version = "0.2.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A modern, GPU-accelerated Rust GUI framework with MVVM, Taffy layout, and wgpu rendering."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gui", "graphics", "wgpu", "ui"]
categories = ["gui", "rendering"]
autobenches = false

exclude = [
    "target/*",
    ".DS_Store",
    "**/.DS_Store",
    "*.png",
    ".github/*",
    "examples/*",
    # docs/ 是独立的 vitepress 站点（含 node_modules / package.json / pnpm-lock /
    # .vitepress 构建配置），属于面向网站的文档工程，不应进入 crate。
    "docs/*",
    "AGENTS.md",
    "CLAUDE.md",
    "PRODUCTION_READINESS.md",
    "FINE_GRAINED_ROADMAP.md",
    "TEMP_BENCHMARK_RESULTS.md",
    "Video.md",
    "publish.bat",
    "skills/*",
    "crates/*",
    "benches/*",
]

[workspace]
members = ["crates/*", "examples/*", "benches"]
default-members = ["."]
resolver = "2"

[workspace.package]
version = "0.2.0"
authors = ["a2542209451@gmail.com"]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nandebishitaoyuan/tgui.git"

[workspace.dependencies]
tgui = { path = ".", version = "0.2.0", default-features = false }
tgui-core = { path = "crates/tgui-core", version = "0.2.0", default-features = false }
tgui-log = { path = "crates/tgui-log", version = "0.2.0", default-features = false }
tgui-media = { path = "crates/tgui-media", version = "0.2.0", default-features = false }
tgui-mvvm = { path = "crates/tgui-mvvm", version = "0.2.0", default-features = false }
tgui-platform = { path = "crates/tgui-platform", version = "0.2.0", default-features = false }
tgui-rendering = { path = "crates/tgui-rendering", version = "0.2.0", default-features = false }
tgui-runtime = { path = "crates/tgui-runtime", version = "0.2.0", default-features = false }
tgui-ui = { path = "crates/tgui-ui", version = "0.2.0", default-features = false }

accesskit = "0.24.1"
bytemuck = { version = "1.25.0", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
cosmic-text = "0.19"
criterion = { version = "0.8.2", features = ["html_reports"] }
crossbeam-channel = "0.5.15"
dpi = "0.1.2"
ffmpeg-next = { version = "8.1.0", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
geo = "0.33.1"
image = { version = "0.25.10", default-features = true, features = ["jpeg", "png", "gif", "webp", "bmp"] }
lyon = "1.0.19"
mimalloc = "0.1.52"
parking_lot = "0.12.5"
pollster = "0.4"
pulldown-cmark = "0.13.4"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls-no-provider"] }
resvg = "0.47"
ropey = "1.6.1"
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12"] }
smallvec = "1.15.2"
svgtypes = "0.16.1"
taffy = "0.11"
toml_edit = { version = "0.25.12", default-features = false, features = ["parse"] }
unicode-segmentation = "1.13.3"
usvg-remote-resolvers = { version = "0.2", features = ["reqwest_blocking"] }
wgpu = { version = "29.0.3", features = ["wgsl"] }
winit = "0.30.13"

accesskit_macos = "0.26.2"
accesskit_unix = "0.22.0"
accesskit_windows = "0.33.1"
arboard = "3.6.1"
block2 = "0.6.2"
cpal = "0.18.1"
log = "0.4.33"
notify-rust = "4.18.0"
objc2 = "0.6.4"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3.2"
raw-window-handle = "0.6.2"
rfd = "0.17.2"
stacker = "0.1.24"
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
audio = ["tgui-runtime/audio"]
video = ["tgui-runtime/video"]
video-static = ["tgui-runtime/video-static"]
bench-support = ["tgui-runtime/bench-support"]
collect-profile = ["tgui-runtime/collect-profile"]
# 可选：用 mimalloc 替换全局分配器。作为 facade feature 保留，由下游二进制
# crate 决定是否启用，避免内部实现 crate 意外选择全局分配器。
mimalloc = ["dep:mimalloc"]

[dependencies]
mimalloc = { workspace = true, optional = true }
tgui-runtime = { workspace = true }
