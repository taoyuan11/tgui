[package]
name = "cargo-tgui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Build desktop application bundles and installers for tgui applications"
readme = "README.md"

[dependencies]
anyhow = "1"
cargo_metadata = "0.18"
cargo-packager = { version = "=0.11.8", default-features = false, features = ["rustls-tls"] }
clap = { version = "4.5", features = ["derive"] }
dunce = "1"
glob = "0.3"
goblin = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
tar = "0.4"
flate2 = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

