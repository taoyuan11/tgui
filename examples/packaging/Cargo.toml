[package]
name = "packaging"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "tgui installation and resource verification example"
license.workspace = true
publish = false

[features]
default = []
media = ["tgui/audio", "tgui/video", "dep:ffmpeg-next"]

[dependencies]
tgui.workspace = true
ffmpeg-next = { workspace = true, optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[package.metadata.tgui.bundle]
identifier = "com.tgui.packaging-example"
product-name = "tgui Packaging"
publisher = "tgui"
icons = ["assets/icon.png", "assets/icon.ico"]
resources = [{ src = "assets", target = "assets" }]
license-files = ["../../LICENSE-MIT", "../../LICENSE-APACHE", "assets/LICENSE.txt"]

[package.metadata.tgui.bundle.windows]
install-mode = "current-user"
languages = ["English", "SimpChinese"]
