# tgui release 工作流
#
# 触发：push 到匹配 v*.*.*  的 git tag。
#
# 流程：
#   1. checkout（含完整历史，便于 cargo / changelog 处理）
#   2. 安装 FFmpeg dev libs（all-features publish 校验需要）
#   3. cargo publish --dry-run --all-features 防误发
#   4. cargo publish（需要 secrets.CARGO_REGISTRY_TOKEN）
#   5. 从 CHANGELOG.md 抽取该 tag 段落作为 release body
#   6. gh release create 发布 GitHub Release
#
# 启用前置条件（仓库 owner 配置一次即可）：
#   - 在 Secrets 中设 CARGO_REGISTRY_TOKEN（来自 https://crates.io/me）
#   - 确保 Cargo.toml 的 version 与 git tag 对齐（publish.bat 已实现该校验，可作为本地参考）

name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.9)"
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install FFmpeg dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libavcodec-dev libavformat-dev libavdevice-dev \
            libavfilter-dev libavutil-dev libswscale-dev libswresample-dev \
            pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      # 推导版本号：tag 形如 v0.1.9，去掉前缀 v 后应与 Cargo.toml 中 package.version 对齐。
      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          CRATE_VERSION=$(grep -m1 -E '^version = "' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')
          if [ "$CRATE_VERSION" != "$VERSION" ]; then
            echo "::error::Cargo.toml version ($CRATE_VERSION) does not match tag ($VERSION)"
            exit 1
          fi

      - name: cargo publish (dry run)
        run: cargo publish --dry-run --all-features

      # TODO: 仓库 owner 在 Settings → Secrets and variables → Actions 中添加
      #       CARGO_REGISTRY_TOKEN。token 来自 https://crates.io/settings/tokens。
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set; aborting publish."
            exit 1
          fi
          cargo publish --all-features

      # 从 CHANGELOG.md 抽取 [VERSION] 段：从该版本标题开始，到下一个 ## 标题之前。
      - name: Extract changelog section
        id: changelog
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          {
            echo "body<<EOF"
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
              capture && $0 ~ "^## \\[" { exit }
              capture { print }
            ' CHANGELOG.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          BODY="${{ steps.changelog.outputs.body }}"
          if [ -z "$BODY" ]; then
            BODY="Release $TAG. See CHANGELOG.md for details."
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$BODY" \
            --repo "${{ github.repository }}"
